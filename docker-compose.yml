services:
  apil:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: ${PORT:-8000}
      OLLAMA_URL: ${OLLAMA_CONTAINER_URL:-http://host.docker.internal:11434}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "${APIL_PORT:-8000}:${PORT:-8000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
